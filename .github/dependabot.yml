# Keeps the npm dependencies and the GitHub Actions used by the workflows up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # The Angular packages pin each other's versions, so they have to move together. The
    # package is built with the oldest Angular it supports (partial compilation output is
    # forward-compatible), so only minor and patch updates are proposed; raising the floor
    # is a deliberate change.
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'ng-packagr'
          - 'zone.js'
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']

  # The smoke app runs the built package. The CI matrix installs the Angular versions it checks
  # (20, the oldest this package supports, and the latest) itself, so only security fixes and
  # its other dependencies need Dependabot.
  - package-ecosystem: 'npm'
    directory: '/examples/smoke-app'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
